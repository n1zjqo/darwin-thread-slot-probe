name: One approved public probe

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: approved-public-probe-once-20261021
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'n1zjqo/darwin-thread-slot-probe' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_number == 1 &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[approved-public-probe-once-20261021]')
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch only the approved public commit
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /usr/bin/false
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$RUNNER_ARCH" = ARM64
          git init .
          git -c credential.helper= -c core.askPass= fetch --no-tags --depth=1 \
            https://github.com/n1zjqo/darwin-thread-slot-probe.git "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/probe-once.yml',
              'README.md',
              'probe.c',
              'slot_contract.h',
              'test_slot_contract.c',
          }
          actual = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')) - {''}
          if actual != expected:
              raise SystemExit('Source file allowlist does not match; refusing execution.')
          PY

      - name: Build and run the portable contract tests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -O2 -arch arm64 \
            test_slot_contract.c -o "$RUNNER_TEMP/test-slot-contract"
          python3 - <<'PY'
          import os, subprocess
          subprocess.run([os.path.join(os.environ['RUNNER_TEMP'], 'test-slot-contract')],
                         check=True, timeout=30)
          PY

      - name: Build the owned macOS probe
        timeout-minutes: 2
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror -O2 -arch arm64 \
            probe.c -o "$RUNNER_TEMP/thread-slot-probe"

      - name: Execute the owned macOS probe once
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          subprocess.run([os.path.join(os.environ['RUNNER_TEMP'], 'thread-slot-probe')],
                         check=True, timeout=60)
          PY

      - name: Compile and link for iOS 15 without execution
        timeout-minutes: 2
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -std=c11 -Wall -Wextra -Werror -O2 \
            -target arm64-apple-ios15.0 -isysroot "$SDKROOT" \
            probe.c -o "$RUNNER_TEMP/thread-slot-probe-ios"
          file "$RUNNER_TEMP/thread-slot-probe-ios"
          xcrun otool -l "$RUNNER_TEMP/thread-slot-probe-ios" | \
            sed -n '/LC_BUILD_VERSION/,+5p'
